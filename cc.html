<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Convertor</title>
    <link href="cc_style.css" rel="stylesheet">
    <!-- for using icons we are using the below link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <h2>Currency Convertor</h2>
        <form>
            <div class="amt">
                <p>Enter Amount</p>
                <input value="100" type="text">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>FROM</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png">        <!-- flag api -->
                        <select name="from">
                            
                        </select>
                        
                    </div>
                </div>
                <i class="fa-solid fa-right-left"></i>          <!--exchange icon-->
                <div class="to">
                    <p>TO</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png">       <!-- flag api -->
                        <select name="to">
                            
                        </select>
                    </div>
                </div>
            </div>
            <br>
            <div class="msg">1 USD =96.56 INR</div>
            <button>Get Exchange Rate</button>
        </form>
    </div>



    <script src="codes.js"></script>
    <script src="cc_logic.js"></script>
</body>
</html>
